<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">Exercises project collection preview</title>
  <desc id="description">A dark red and charcoal preview for the exercises Google Drive folder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#272a31"/>
      <stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="70%">
      <stop offset="0" stop-color="#ef3434" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ef3434" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="600" fill="url(#background)"/>
  <rect width="960" height="600" fill="url(#glow)"/>
  <path d="M0 465 240 350l170 94 198-207 352 199v164H0Z" fill="#ef3434" opacity=".16"/>
  <rect x="56" y="52" width="848" height="496" rx="24" fill="none" stroke="#fff" stroke-opacity=".13"/>
  <text x="92" y="250" fill="#ff6868" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6">EXERCISES</text>
  <text x="88" y="322" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-3">PROJECT COLLECTION</text>
  <text x="92" y="370" fill="#c2c6ce" font-family="Segoe UI,Arial,sans-serif" font-size="24">Open the folder to view all exercises</text>
</svg>
